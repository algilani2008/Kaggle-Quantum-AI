[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "sigdiff"
version = "0.1.0"
description = "Paired significance tests and confidence intervals for comparing ML models"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = ["numpy>=1.23", "scipy>=1.9", "pandas>=1.5"]

[project.scripts]
sigdiff = "sigdiff.cli:main"

[tool.setuptools]
packages = ["sigdiff"]
